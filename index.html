<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FuelWatch Perth — Live Fuel Prices WA</title>
  <meta name="description" content="Live ULP 91 and Premium 95 fuel prices across Perth suburbs. Find the cheapest petrol station near you, updated daily from FuelWatch WA.">

  <!-- Open Graph (WhatsApp, iMessage, Facebook previews) -->
  <meta property="og:title"       content="FuelWatch Perth — Live Fuel Prices WA">
  <meta property="og:description" content="Live ULP 91 and Premium 95 fuel prices across Perth suburbs. Find the cheapest petrol near you, updated daily.">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://ningchoi-dev.github.io/fuelwatch/">
  <meta property="og:image"       content="https://ningchoi-dev.github.io/fuelwatch/static/icon-512.png">
  <meta property="og:site_name"   content="FuelWatch Perth">

  <!-- Twitter / X card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="FuelWatch Perth — Live Fuel Prices WA">
  <meta name="twitter:description" content="Live ULP 91 and Premium 95 fuel prices across Perth suburbs, updated daily.">
  <meta name="twitter:image"       content="https://ningchoi-dev.github.io/fuelwatch/static/icon-512.png">

  <link rel="canonical" href="https://ningchoi-dev.github.io/fuelwatch/">
  <link rel="manifest" href="static/manifest.json">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FuelWatch">
  <link rel="apple-touch-icon" href="static/icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #4f8ef7;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --text: #e2e8f0;
      --muted: #8892a4;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 48px);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 20px; }

    header h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 800; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }

    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s;
      -webkit-appearance: none;
    }

    .location-pill:hover, .location-pill:active { border-color: var(--accent); color: var(--text); }
    .location-pill.locating { color: var(--amber); border-color: var(--amber); }
    .location-pill.located  { color: var(--green); border-color: var(--green); background: #1a2e1a; }
    .location-pill.error    { color: var(--red);   border-color: var(--red); }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 10px 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-appearance: none;
    }
    .refresh-btn:active { transform: scale(0.96); opacity: 0.85; }
    .refresh-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .refresh-btn.spinning { animation: spin 0.7s linear infinite; }

    #last-updated {
      display: block;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Day tabs ── */
    .day-tabs {
      display: flex;
      max-width: 600px;
      margin: 0 auto 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .day-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s;
      text-align: center;
    }

    .day-tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .day-tab .day-price-hint {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      margin-top: 2px;
      opacity: 0.7;
    }

    /* ── Fuel tabs ── */
    .fuel-tabs {
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto 14px;
    }

    .fuel-tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
      transition: all 0.15s;
    }

    .fuel-tab.active-91 { background: #1d3a6e; border-color: #4f8ef7; color: #93c5fd; }
    .fuel-tab.active-95 { background: #3b1d6e; border-color: #a78bfa; color: #c4b5fd; }

    /* ── Panels ── */
    .fuel-panel { display: none; max-width: 600px; margin: 0 auto; }
    .fuel-panel.visible { display: block; }

    /* ── Summary card ── */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .summary-main { flex: 1; }

    .summary-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-price {
      font-size: clamp(2.4rem, 9vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    .summary-price .unit { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 2px; letter-spacing: 0; }

    .summary-sub {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .summary-sub span { font-size: 0.78rem; color: var(--muted); }
    .summary-sub span b { color: var(--text); font-weight: 600; }

    .summary-cheapest {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-cheapest strong { color: var(--text); }

    /* Tomorrow comparison badge */
    .tmr-badge {
      flex-shrink: 0;
      text-align: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 80px;
    }

    .tmr-badge .tmr-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .tmr-badge .tmr-price { font-size: 1.3rem; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.5px; }
    .tmr-badge .tmr-diff { font-size: 0.72rem; font-weight: 700; }

    .up   { color: var(--red); }
    .down { color: var(--green); }
    .same { color: var(--muted); }

    /* ── Recommendation ── */
    .rec-banner {
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .rec-banner .rec-icon { font-size: 1.4rem; flex-shrink: 0; }
    .rec-wait    { background: #1e2d1a; border: 1px solid #2d5c25; color: var(--green); }
    .rec-fill    { background: #2d1a1a; border: 1px solid #5c2525; color: var(--red); }
    .rec-neutral { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

    /* ── Stations ── */
    .stations-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .stations-header {
      padding: 12px 16px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stations-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .station-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
    }

    .station-row:last-child { border-bottom: none; }
    .station-row:hover, .station-row:active { background: var(--surface2); }

    .station-rank { font-size: 0.72rem; color: var(--muted); width: 18px; flex-shrink: 0; text-align: right; }
    .station-info { flex: 1; min-width: 0; }
    .station-info .s-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-info .s-addr { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-price { font-size: 1rem; font-weight: 700; flex-shrink: 0; }
    .station-price .cpl { font-size: 0.68rem; color: var(--muted); }
    .station-row:first-of-type .station-price { color: var(--green); }
    .station-map-icon { font-size: 1.1rem; color: var(--muted); flex-shrink: 0; }

    /* ── Chart ── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
    }

    .chart-card h3 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .chart-wrapper { position: relative; height: 160px; }
    .no-history { text-align: center; padding: 28px; color: var(--muted); font-size: 0.85rem; }

    /* ── Loading / Error ── */
    .loading-overlay { display: none; text-align: center; padding: 60px 20px; color: var(--muted); }

    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #content { display: none; }

    .error-msg {
      display: none;
      background: #2d1a1a;
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
      font-size: 0.88rem;
    }

    .inline-spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      display: inline-block;
      margin-top: 10px;
      width: min(320px, 90vw);
    }

    .search-input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .search-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      list-style: none;
      overflow: hidden;
      z-index: 99;
      box-shadow: 0 8px 24px #0008;
      max-height: 240px;
      overflow-y: auto;
    }

    .search-dropdown li {
      padding: 11px 16px;
      font-size: 0.88rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      text-align: left;
      transition: background 0.1s;
    }

    .search-dropdown li:last-child { border-bottom: none; }
    .search-dropdown li:hover,
    .search-dropdown li.active { background: var(--surface); color: var(--accent); }
    .search-dropdown li .match { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>⛽ Fuel<span>Watch</span></h1>
    <button class="location-pill" id="loc-btn" onclick="requestLocation()">
      <span id="loc-icon">📍</span>
      <span id="loc-label">Use my location</span>
    </button>

    <div class="search-wrap" id="search-wrap">
      <input id="search-input" class="search-input" type="text"
             placeholder="Search suburb…" autocomplete="off"
             oninput="onSearchInput(this.value)"
             onkeydown="onSearchKey(event)">
      <ul class="search-dropdown" id="search-dropdown"></ul>
    </div>

    <div id="last-updated"></div>
    <br>
    <button class="refresh-btn" id="refresh-btn" onclick="refreshPrices()">↻ Refresh</button>
  </header>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div id="loading-msg">Loading prices…</div>
  </div>

  <div class="error-msg" id="error-msg">Could not load prices. Try again later.</div>

  <div id="content">
    <!-- Day tabs -->
    <div class="day-tabs" id="day-tabs">
      <button class="day-tab active" data-day="today" onclick="switchDay('today')">
        Today
        <span class="day-price-hint" id="hint-today-91"></span>
      </button>
      <button class="day-tab" data-day="tomorrow" onclick="switchDay('tomorrow')">
        Tomorrow
        <span class="day-price-hint" id="hint-tomorrow-91"></span>
      </button>
    </div>

    <!-- Fuel tabs -->
    <div class="fuel-tabs" id="fuel-tabs"></div>

    <!-- Panels per fuel type -->
    <div id="panels"></div>
  </div>

  <script>
    /* ── State ── */
    let allData    = null;   // prices.json
    let liveData   = null;   // location-fetched live data
    let activeTab  = null;
    let activeDay  = 'today';
    let detectedSuburb = localStorage.getItem('fw-suburb') || null;
    const charts   = {};
    const showAllMap = {};

    /* ── Service worker ── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    /* ─────────────────────────────── helpers ── */
    const fuelColor = n => n.includes('91') ? '#4f8ef7' : '#a78bfa';
    const fmt       = p => p != null ? p.toFixed(1) : '—';

    function diffLabel(diff) {
      if (diff == null) return { text: '—', cls: 'same' };
      const sign = diff > 0 ? '+' : '';
      return {
        text: `${sign}${diff.toFixed(1)}¢`,
        cls:  diff > 1 ? 'up' : diff < -1 ? 'down' : 'same'
      };
    }

    function summarise(stations) {
      if (!stations || !stations.length) return null;
      const prices = stations.map(s => s.price);
      return {
        min:      Math.min(...prices),
        avg:      +(prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(1),
        max:      Math.max(...prices),
        count:    stations.length,
        cheapest: stations[0],
        stations: stations.slice(0, 15),
      };
    }

    function recommendation(todayMin, tmrMin) {
      if (todayMin == null || tmrMin == null) return null;
      const diff = +(tmrMin - todayMin).toFixed(1);
      if (diff <= -3) return { action: 'wait', diff, icon: '⏳', text: `Wait until tomorrow — prices drop ${Math.abs(diff)}c/L` };
      if (diff >=  3) return { action: 'fill', diff, icon: '⛽', text: `Fill up today — prices rise ${diff}c/L tomorrow` };
      return { action: 'neutral', diff, icon: '✓', text: 'Prices are similar — fill up whenever suits you' };
    }

    /* ─────────────────────────────── Suburb lookup (no CORS needed) ── */
    let suburbData = null;  // loaded from data/by_suburb.json

    async function loadSuburbData() {
      if (suburbData) return suburbData;
      try {
        const r = await fetch('data/by_suburb.json?t=' + Date.now());
        if (r.ok) suburbData = await r.json();
      } catch { suburbData = {}; }
      return suburbData || {};
    }

    // Find the best matching suburb key in by_suburb.json
    // Tries exact match, then partial match
    function findSuburbKey(lookup, detectedName) {
      const name = detectedName.toLowerCase();
      // Exact match
      for (const key of Object.keys(lookup)) {
        if (key.toLowerCase() === name) return key;
      }
      // Partial — detected name starts with a key word
      for (const key of Object.keys(lookup)) {
        if (key.toLowerCase().includes(name) || name.includes(key.toLowerCase())) return key;
      }
      return null;
    }

    function buildLiveDataFromLookup(lookup, suburbKey) {
      const entry = lookup[suburbKey] || {}; // empty entry = no own stations, fill from nearby
      const result = {};
      const fuelNames = ['Unleaded 91', 'Premium 95'];
      let hasAnyData = false;

      // All stations from suburb + surrounding, sorted cheapest first —
      // mirrors FuelWatch's own sort order
      function filledStations(primary, dataKey) {
        const seen = new Set(primary.map(s => `${s.name}|${s.address}`));
        const extras = [];
        for (const [key, sub] of Object.entries(lookup)) {
          if (key === suburbKey) continue;
          for (const s of (sub[dataKey]?.stations || [])) {
            const id = `${s.name}|${s.address}`;
            if (!seen.has(id)) { seen.add(id); extras.push(s); }
          }
        }
        return [...primary, ...extras]
          .sort((a, b) => a.price - b.price)
          .slice(0, 5);
      }

      // Build summary from stations — uses raw as base if available,
      // synthesises from filled stations if the suburb has no own data
      function summarise(raw, stations) {
        if (!stations.length) return null;
        const prices = stations.map(s => s.price);
        return {
          ...(raw || {}),
          min:      Math.min(...prices),
          avg:      +(prices.reduce((a, b) => a + b) / prices.length).toFixed(1),
          max:      Math.max(...prices),
          count:    stations.length,
          cheapest: stations[0],
          stations,
        };
      }

      for (const name of fuelNames) {
        const todayRaw    = entry[name];
        const tomorrowRaw = entry[name + '_tomorrow'];
        const todayStations    = filledStations(todayRaw?.stations    || [], name);
        const tomorrowStations = filledStations(tomorrowRaw?.stations || [], name + '_tomorrow');
        const today    = summarise(todayRaw,    todayStations);
        const tomorrow = summarise(tomorrowRaw, tomorrowStations);
        if (today || tomorrow) hasAnyData = true;
        result[name] = {
          today,
          tomorrow,
          recommendation: recommendation(today?.min ?? null, tomorrow?.min ?? null),
          fetched_at:     allData?.[name]?.fetched_at || '',
          history:        allData?.[name]?.history    || [],
        };
      }
      // If no actual price data found (suburb has no stations), fall back to default area
      return hasAnyData ? result : null;
    }

    /* ─────────────────────────────── Nearest suburb helpers ── */

    // Haversine distance in km between two lat/lng points
    function haversineDist(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2
              + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
      return R * 2 * Math.asin(Math.sqrt(a));
    }

    // Find the closest suburb in lookup (by centroid) that has actual price data
    function findNearestSuburbWithData(refLat, refLng, lookup) {
      let bestKey = null, bestDist = Infinity;
      for (const [key, entry] of Object.entries(lookup)) {
        if (!entry._centroid) continue;
        const hasData = ['Unleaded 91', 'Premium 95']
          .some(f => entry[f] || entry[f + '_tomorrow']);
        if (!hasData) continue;
        const dist = haversineDist(refLat, refLng, entry._centroid.lat, entry._centroid.lng);
        if (dist < bestDist) { bestDist = dist; bestKey = key; }
      }
      return bestKey;
    }

    // Geocode a suburb name → {lat, lng} via Nominatim (used for search fallback)
    async function geocodeSuburb(name) {
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 6000);
        const r = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name + ', Western Australia, Australia')}&format=json&limit=1`,
          { signal: ctrl.signal, headers: { 'Accept-Language': 'en-AU' } });
        const data = await r.json();
        if (data.length) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      } catch {}
      return null;
    }

    /* ─────────────────────────────── Location ── */
    async function requestLocation() {
      const btn   = document.getElementById('loc-btn');
      const icon  = document.getElementById('loc-icon');
      const label = document.getElementById('loc-label');

      btn.className    = 'location-pill locating';
      icon.textContent = '';
      label.innerHTML  = '<span class="inline-spinner"></span> Locating…';
      btn.disabled     = true;

      // 1 — GPS coords (only hard failure point)
      let userLat, userLng;
      try {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { timeout: 12000, enableHighAccuracy: false }));
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
      } catch (err) {
        btn.className    = 'location-pill error';
        icon.textContent = '⚠️';
        label.textContent = err.code === 1 ? 'Blocked — allow in browser settings'
                          : err.code === 3 ? 'Timed out — tap to retry'
                          : 'Unavailable — search your suburb instead';
        btn.disabled = false;
        // Auto-focus search so the user can immediately type their suburb
        if (err.code !== 1) {
          setTimeout(() => document.getElementById('search-input')?.focus(), 300);
        }
        return;
      }

      // 2 — Find nearest suburb from local data (no external API, never fails)
      label.innerHTML = '<span class="inline-spinner"></span> Finding suburb…';
      const lookup     = await loadSuburbData();
      const nearestKey = findNearestSuburbWithData(userLat, userLng, lookup);

      if (!nearestKey) {
        // Outside coverage — show default
        btn.className   = 'location-pill located';
        icon.textContent = '📍';
        label.textContent = 'Outside coverage';
        document.getElementById('last-updated').textContent =
          `📍 Outside coverage area — showing default prices`;
        render(allData);
        btn.disabled = false;
        return;
      }

      liveData = buildLiveDataFromLookup(lookup, nearestKey);
      btn.className    = 'location-pill located';
      icon.textContent = '📍';
      label.textContent = nearestKey;
      detectedSuburb    = nearestKey;
      localStorage.setItem('fw-suburb', nearestKey);
      document.getElementById('last-updated').textContent =
        `📍 ${nearestKey} · ${allData ? Object.values(allData)[0]?.fetched_at || '' : ''}`;
      render(liveData);
      btn.disabled = false;

      // 3 — Try Nominatim in the background for a better display name (optional, non-blocking)
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 8000);
        const geo     = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${userLat}&lon=${userLng}&format=json`,
          { signal: ctrl.signal, headers: { 'Accept-Language': 'en-AU' } });
        const geoData = await geo.json();
        const suburb  = geoData.address?.suburb
                     || geoData.address?.city_district
                     || geoData.address?.town
                     || geoData.address?.village;
        if (suburb) {
          detectedSuburb    = suburb;
          localStorage.setItem('fw-suburb', suburb);
          label.textContent = suburb;
          document.getElementById('last-updated').textContent =
            `📍 ${suburb} · ${allData ? Object.values(allData)[0]?.fetched_at || '' : ''}`;
        }
      } catch { /* Nominatim failed — no problem, nearestKey is already shown */ }
    }

    /* ─────────────────────────────── Render ── */
    function currentData() { return liveData || allData; }

    function render(data) {
      if (!data) return;
      const names   = Object.keys(data);
      const tabsEl  = document.getElementById('fuel-tabs');
      const panelsEl = document.getElementById('panels');
      tabsEl.innerHTML  = '';
      panelsEl.innerHTML = '';

      names.forEach(name => {
        // Fuel tab
        const tab = document.createElement('button');
        tab.className  = 'fuel-tab';
        tab.dataset.name = name;
        tab.textContent  = name;
        tab.onclick = () => switchFuel(name);
        tabsEl.appendChild(tab);

        // Panel
        const panel = document.createElement('div');
        panel.className = 'fuel-panel';
        panel.id = `panel-${name.replace(/\s/g, '-')}`;
        panelsEl.appendChild(panel);
      });

      updateDayHints(data);
      switchFuel(activeTab && data[activeTab] ? activeTab : names[0]);
      document.getElementById('content').style.display = 'block';
    }

    function updateDayHints(data) {
      // Show cheapest min price in day tab hints for ULP91
      const fuel91 = data['Unleaded 91'];
      if (!fuel91) return;
      const h91t = document.getElementById('hint-today-91');
      const h91m = document.getElementById('hint-tomorrow-91');
      if (h91t && fuel91.today)    h91t.textContent = fmt(fuel91.today.min) + '¢';
      if (h91m && fuel91.tomorrow) h91m.textContent = fmt(fuel91.tomorrow.min) + '¢';
    }

    function switchDay(day) {
      activeDay = day;
      document.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', t.dataset.day === day));
      // Re-render current fuel panel
      const data = currentData();
      if (data && activeTab) renderFuelPanel(activeTab, data[activeTab]);
    }

    function switchFuel(name) {
      activeTab = name;
      document.querySelectorAll('.fuel-tab').forEach(t => {
        t.classList.remove('active-91', 'active-95');
      });
      const tab = document.querySelector(`.fuel-tab[data-name="${name}"]`);
      if (tab) tab.classList.add(name.includes('91') ? 'active-91' : 'active-95');
      document.querySelectorAll('.fuel-panel').forEach(p => p.classList.remove('visible'));
      const panel = document.getElementById(`panel-${name.replace(/\s/g, '-')}`);
      if (panel) {
        panel.classList.add('visible');
        renderFuelPanel(name, currentData()[name]);
      }
    }

    function toggleStations(key) {
      showAllMap[key] = !showAllMap[key];
      renderFuelPanel(activeTab, currentData()[activeTab]);
    }

    function stationList(stations, toggleKey) {
      if (!stations || !stations.length)
        return '<div style="padding:16px;color:var(--muted);font-size:.85rem">No stations found</div>';
      const showAll    = showAllMap[toggleKey] || false;
      const visible    = showAll ? stations : stations.slice(0, 10);
      const rows       = visible.map((s, i) => {
        const mapsQ = encodeURIComponent(
          [s.name, s.address, s.suburb].filter(Boolean).join(', ')
        );
        const mapsUrl = s.lat && s.lng
          ? `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`
          : `https://www.google.com/maps/search/?api=1&query=${mapsQ}`;
        return `
        <a class="station-row" href="${mapsUrl}" target="_blank" rel="noopener">
          <div class="station-rank">${i + 1}</div>
          <div class="station-info">
            <div class="s-name">${s.name || '—'}</div>
            <div class="s-addr">${s.suburb}${s.address ? ' · ' + s.address : ''}</div>
          </div>
          <div class="station-price">${fmt(s.price)}<span class="cpl">¢</span></div>
          <div class="station-map-icon">›</div>
        </a>`;
      }).join('');
      const toggleBtn  = stations.length > 10
        ? `<button class="stations-toggle" onclick="toggleStations('${toggleKey}')">${showAll ? 'Show less' : 'Show all ' + stations.length}</button>`
        : '';
      return rows + (toggleBtn
        ? `<div style="padding:10px 16px;border-top:1px solid var(--border);text-align:right">${toggleBtn}</div>`
        : '');
    }

    function renderFuelPanel(name, data) {
      const panel = document.getElementById(`panel-${name.replace(/\s/g, '-')}`);
      if (!panel || !data) return;

      const day    = activeDay;
      const info   = data[day];
      const other  = day === 'today' ? data.tomorrow : data.today;
      const rec    = data.recommendation;
      const hist   = data.history || [];

      // Diff badge
      const diff    = (info?.min != null && other?.min != null)
        ? +(other.min - info.min).toFixed(1) : null;
      const diffObj  = diffLabel(diff);
      const otherLabel = day === 'today' ? 'Tomorrow' : 'Today';

      // Summary card
      const summaryHtml = info ? `
        <div class="summary-card">
          <div class="summary-main">
            <div class="summary-label">${day === 'today' ? "Today's" : "Tomorrow's"} cheapest</div>
            <div class="summary-price">${fmt(info.min)}<span class="unit">¢/L</span></div>
            <div class="summary-sub">
              <span>Avg <b>${fmt(info.avg)}¢</b></span>
              <span>Max <b>${fmt(info.max)}¢</b></span>
              <span><b>${info.count}</b> stations</span>
            </div>
            ${info.cheapest ? `<div class="summary-cheapest">Cheapest: <strong>${info.cheapest.name}</strong>, ${info.cheapest.suburb}</div>` : ''}
          </div>
          ${other ? `
          <div class="tmr-badge">
            <div class="tmr-label">${otherLabel}</div>
            <div class="tmr-price ${diffObj.cls}">${fmt(other.min)}¢</div>
            <div class="tmr-diff ${diffObj.cls}">${diffObj.text}</div>
          </div>` : ''}
        </div>` : `
        <div class="summary-card" style="color:var(--muted)">No data available for ${day}</div>`;

      // Recommendation
      const recHtml = rec ? `
        <div class="rec-banner rec-${rec.action}">
          <span class="rec-icon">${rec.icon}</span>
          <span>${rec.text}</span>
        </div>` : '';

      // Today's stations
      const todayStationsHtml = `
        <div class="stations-section">
          <div class="stations-header"><span>📅 Today's Cheapest Stations</span></div>
          ${stationList(data.today?.stations || [], `${name}-today`)}
        </div>`;

      // Tomorrow's stations
      const tmrStationsHtml = `
        <div class="stations-section">
          <div class="stations-header"><span>🔜 Tomorrow's Cheapest Stations</span></div>
          ${stationList(data.tomorrow?.stations || [], `${name}-tomorrow`)}
        </div>`;

      // Chart
      const chartId   = `chart-${name.replace(/\s/g, '-')}`;
      const chartHtml = hist.length > 1
        ? `<div class="chart-card"><h3>Price History — Lowest ¢/L</h3><div class="chart-wrapper"><canvas id="${chartId}"></canvas></div></div>`
        : `<div class="chart-card"><h3>Price History</h3><div class="no-history">History builds daily — check back tomorrow!</div></div>`;

      panel.innerHTML = summaryHtml + recHtml + todayStationsHtml + tmrStationsHtml + chartHtml;

      if (hist.length > 1) setTimeout(() => buildChart(name, hist), 30);
    }

    function buildChart(name, hist) {
      const chartId = `chart-${name.replace(/\s/g, '-')}`;
      const ctx = document.getElementById(chartId);
      if (!ctx) return;
      if (charts[name]) charts[name].destroy();
      const color = fuelColor(name);
      charts[name] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: hist.map(h => new Date(h.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })),
          datasets: [
            { label: 'Min', data: hist.map(h => h.min), borderColor: color, backgroundColor: color + '22', borderWidth: 2, pointRadius: hist.length < 14 ? 4 : 2, pointBackgroundColor: color, fill: true, tension: 0.35 },
            { label: 'Avg', data: hist.map(h => h.avg), borderColor: color + '77', borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, fill: false, tension: 0.35 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 12 } },
            tooltip: { callbacks: { label: c => ` ${c.parsed.y.toFixed(1)}¢/L` } }
          },
          scales: {
            x: { ticks: { color: '#8892a4', font: { size: 9 }, maxTicksLimit: 7 }, grid: { color: '#2e3347' } },
            y: { ticks: { color: '#8892a4', font: { size: 9 }, callback: v => v + '¢' }, grid: { color: '#2e3347' } }
          }
        }
      });
    }

    /* ─────────────────────────────── Initial load ── */
    async function load() {
      document.getElementById('loading').style.display = 'block';
      try {
        // Load both in parallel — prices.json for display, by_suburb.json for search
        const [pricesResp] = await Promise.all([
          fetch('data/prices.json?t=' + Date.now()),
          loadSuburbData(),   // preload suburb index so search works instantly
        ]);
        const resp = pricesResp;
        if (!resp.ok) throw new Error();
        allData = await resp.json();

        const firstKey = Object.keys(allData)[0];
        document.getElementById('last-updated').textContent =
          `Perth · Updated ${allData[firstKey]?.fetched_at || ''}`;

        // Restore last selected suburb if one was saved
        if (detectedSuburb && suburbData) {
          const key   = findSuburbKey(suburbData, detectedSuburb) || detectedSuburb;
          const saved = buildLiveDataFromLookup(suburbData, key);
          if (saved) {
            liveData = saved;
            render(liveData);
            document.getElementById('last-updated').textContent =
              `🔍 ${detectedSuburb} · Updated ${allData[firstKey]?.fetched_at || ''}`;
          } else {
            render(allData);
          }
        } else {
          render(allData);
        }
      } catch {
        document.getElementById('error-msg').style.display = 'block';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    /* ─────────────────────────────── Search ── */
    let searchIndex    = -1;
    let searchMatches  = [];

    function onSearchInput(val) {
      const dropdown = document.getElementById('search-dropdown');
      searchIndex = -1;

      if (!val.trim() || !suburbData) {
        dropdown.style.display = 'none';
        return;
      }

      const q = val.toLowerCase().trim();
      searchMatches = Object.keys(suburbData)
        .filter(k => k.toLowerCase().includes(q))
        .sort((a, b) => {
          // Exact start match ranks first
          const aStart = a.toLowerCase().startsWith(q);
          const bStart = b.toLowerCase().startsWith(q);
          if (aStart && !bStart) return -1;
          if (!aStart && bStart) return 1;
          return a.localeCompare(b);
        })
        .slice(0, 8);

      if (!searchMatches.length) {
        dropdown.style.display = 'none';
        return;
      }

      // Highlight matching portion
      dropdown.innerHTML = searchMatches.map((name, i) => {
        const idx  = name.toLowerCase().indexOf(q);
        const hi   = idx >= 0
          ? name.slice(0, idx) + `<span class="match">${name.slice(idx, idx + q.length)}</span>` + name.slice(idx + q.length)
          : name;
        return `<li data-i="${i}" onmousedown="selectSuburb('${name}')">${hi}</li>`;
      }).join('');

      dropdown.style.display = 'block';
    }

    function onSearchKey(e) {
      const dropdown = document.getElementById('search-dropdown');
      const items    = dropdown.querySelectorAll('li');
      if (!items.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        searchIndex = Math.min(searchIndex + 1, items.length - 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        searchIndex = Math.max(searchIndex - 1, -1);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const name = searchIndex >= 0 ? searchMatches[searchIndex] : searchMatches[0];
        if (name) selectSuburb(name);
        return;
      } else if (e.key === 'Escape') {
        dropdown.style.display = 'none';
        return;
      }

      items.forEach((li, i) => li.classList.toggle('active', i === searchIndex));
    }

    async function selectSuburb(name) {
      const dropdown = document.getElementById('search-dropdown');
      const input    = document.getElementById('search-input');
      dropdown.style.display = 'none';
      input.value   = name;
      input.blur();

      // Reset location pill back to default
      const btn   = document.getElementById('loc-btn');
      const icon  = document.getElementById('loc-icon');
      const label = document.getElementById('loc-label');
      btn.className     = 'location-pill';
      icon.textContent  = '📍';
      label.textContent = 'Use my location';

      const lookup = suburbData || {};
      const key    = findSuburbKey(lookup, name) || name;
      liveData     = buildLiveDataFromLookup(lookup, key);
      detectedSuburb = name;
      localStorage.setItem('fw-suburb', name);

      if (liveData) {
        document.getElementById('last-updated').textContent =
          `🔍 ${name} · ${allData ? Object.values(allData)[0]?.fetched_at || '' : ''}`;
        render(liveData);
        return;
      }

      // No data for this suburb — geocode it, then find nearest suburb with data
      input.value = name + ' · finding nearest…';
      const coords = await geocodeSuburb(name);
      input.value  = name;

      if (coords) {
        const nearestKey = findNearestSuburbWithData(coords.lat, coords.lng, lookup);
        if (nearestKey) {
          liveData = buildLiveDataFromLookup(lookup, nearestKey);
          document.getElementById('last-updated').textContent =
            `🔍 ${name} · Nearest prices: ${nearestKey} · ${allData ? Object.values(allData)[0]?.fetched_at || '' : ''}`;
          render(liveData);
          return;
        }
      }

      // Final fallback — show default area prices
      liveData = null;
      document.getElementById('last-updated').textContent =
        `🔍 ${name} — no data found, showing default prices`;
      render(allData);
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', e => {
      if (!document.getElementById('search-wrap')?.contains(e.target)) {
        const d = document.getElementById('search-dropdown');
        if (d) d.style.display = 'none';
      }
    });

    async function refreshPrices() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = '↻ Refreshing…';

      try {
        const resp = await fetch('data/prices.json?t=' + Date.now());
        if (!resp.ok) throw new Error();
        allData = await resp.json();

        // Rebuild liveData from cached suburb data if a suburb was selected
        if (detectedSuburb && suburbData) {
          const key   = findSuburbKey(suburbData, detectedSuburb) || detectedSuburb;
          const fresh = buildLiveDataFromLookup(suburbData, key);
          if (fresh) liveData = fresh;
        }

        render(liveData || allData);

        const fetched  = Object.values(allData)[0]?.fetched_at || '';
        const checkedAt = new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
        const prefix   = detectedSuburb ? `📍 ${detectedSuburb}` : 'Perth';
        document.getElementById('last-updated').textContent =
          `${prefix} · Prices from ${fetched} · Checked ${checkedAt}`;

        btn.textContent = '✓ Up to date';
        setTimeout(() => { btn.textContent = '↻ Refresh'; btn.disabled = false; }, 1500);

      } catch {
        btn.textContent = '✗ Failed — tap to retry';
        setTimeout(() => { btn.textContent = '↻ Refresh'; btn.disabled = false; }, 2000);
      }
    }

    load();
  </script>
</body>
</html>
