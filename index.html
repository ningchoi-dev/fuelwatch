<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FuelWatch — Cockburn</title>

  <link rel="manifest" href="static/manifest.json">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FuelWatch">
  <link rel="apple-touch-icon" href="static/icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #4f8ef7;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --text: #e2e8f0;
      --muted: #8892a4;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 48px);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 20px; }

    header h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 800; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }

    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s;
      -webkit-appearance: none;
    }

    .location-pill:hover, .location-pill:active { border-color: var(--accent); color: var(--text); }
    .location-pill.locating { color: var(--amber); border-color: var(--amber); }
    .location-pill.located  { color: var(--green); border-color: var(--green); background: #1a2e1a; }
    .location-pill.error    { color: var(--red);   border-color: var(--red); }

    #last-updated {
      display: block;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Day tabs ── */
    .day-tabs {
      display: flex;
      max-width: 600px;
      margin: 0 auto 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .day-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s;
      text-align: center;
    }

    .day-tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .day-tab .day-price-hint {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      margin-top: 2px;
      opacity: 0.7;
    }

    /* ── Fuel tabs ── */
    .fuel-tabs {
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto 14px;
    }

    .fuel-tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
      transition: all 0.15s;
    }

    .fuel-tab.active-91 { background: #1d3a6e; border-color: #4f8ef7; color: #93c5fd; }
    .fuel-tab.active-95 { background: #3b1d6e; border-color: #a78bfa; color: #c4b5fd; }

    /* ── Panels ── */
    .fuel-panel { display: none; max-width: 600px; margin: 0 auto; }
    .fuel-panel.visible { display: block; }

    /* ── Summary card ── */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .summary-main { flex: 1; }

    .summary-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-price {
      font-size: clamp(2.4rem, 9vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    .summary-price .unit { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 2px; letter-spacing: 0; }

    .summary-sub {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .summary-sub span { font-size: 0.78rem; color: var(--muted); }
    .summary-sub span b { color: var(--text); font-weight: 600; }

    .summary-cheapest {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-cheapest strong { color: var(--text); }

    /* Tomorrow comparison badge */
    .tmr-badge {
      flex-shrink: 0;
      text-align: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 80px;
    }

    .tmr-badge .tmr-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .tmr-badge .tmr-price { font-size: 1.3rem; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.5px; }
    .tmr-badge .tmr-diff { font-size: 0.72rem; font-weight: 700; }

    .up   { color: var(--red); }
    .down { color: var(--green); }
    .same { color: var(--muted); }

    /* ── Recommendation ── */
    .rec-banner {
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .rec-banner .rec-icon { font-size: 1.4rem; flex-shrink: 0; }
    .rec-wait    { background: #1e2d1a; border: 1px solid #2d5c25; color: var(--green); }
    .rec-fill    { background: #2d1a1a; border: 1px solid #5c2525; color: var(--red); }
    .rec-neutral { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

    /* ── Stations ── */
    .stations-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .stations-header {
      padding: 12px 16px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stations-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .station-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .station-row:last-child { border-bottom: none; }

    .station-rank { font-size: 0.72rem; color: var(--muted); width: 18px; flex-shrink: 0; text-align: right; }
    .station-info { flex: 1; min-width: 0; }
    .station-info .s-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-info .s-addr { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station-price { font-size: 1rem; font-weight: 700; flex-shrink: 0; }
    .station-price .cpl { font-size: 0.68rem; color: var(--muted); }
    .station-row:first-of-type .station-price { color: var(--green); }

    /* ── Chart ── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
    }

    .chart-card h3 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .chart-wrapper { position: relative; height: 160px; }
    .no-history { text-align: center; padding: 28px; color: var(--muted); font-size: 0.85rem; }

    /* ── Loading / Error ── */
    .loading-overlay { display: none; text-align: center; padding: 60px 20px; color: var(--muted); }

    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #content { display: none; }

    .error-msg {
      display: none;
      background: #2d1a1a;
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
      font-size: 0.88rem;
    }

    .inline-spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <h1>⛽ Fuel<span>Watch</span></h1>
    <button class="location-pill" id="loc-btn" onclick="requestLocation()">
      <span id="loc-icon">📍</span>
      <span id="loc-label">Use my location</span>
    </button>
    <div id="last-updated"></div>
  </header>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div id="loading-msg">Loading prices…</div>
  </div>

  <div class="error-msg" id="error-msg">Could not load prices. Try again later.</div>

  <div id="content">
    <!-- Day tabs -->
    <div class="day-tabs" id="day-tabs">
      <button class="day-tab active" data-day="today" onclick="switchDay('today')">
        Today
        <span class="day-price-hint" id="hint-today-91"></span>
      </button>
      <button class="day-tab" data-day="tomorrow" onclick="switchDay('tomorrow')">
        Tomorrow
        <span class="day-price-hint" id="hint-tomorrow-91"></span>
      </button>
    </div>

    <!-- Fuel tabs -->
    <div class="fuel-tabs" id="fuel-tabs"></div>

    <!-- Panels per fuel type -->
    <div id="panels"></div>
  </div>

  <script>
    /* ── State ── */
    let allData    = null;   // prices.json
    let liveData   = null;   // location-fetched live data
    let activeTab  = null;
    let activeDay  = 'today';
    let detectedSuburb = null;
    const charts   = {};
    const showAllMap = {};

    /* ── Service worker ── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('static/sw.js').catch(() => {});
    }

    /* ─────────────────────────────── helpers ── */
    const fuelColor = n => n.includes('91') ? '#4f8ef7' : '#a78bfa';
    const fmt       = p => p != null ? p.toFixed(1) : '—';

    function diffLabel(diff) {
      if (diff == null) return { text: '—', cls: 'same' };
      const sign = diff > 0 ? '+' : '';
      return {
        text: `${sign}${diff.toFixed(1)}¢`,
        cls:  diff > 1 ? 'up' : diff < -1 ? 'down' : 'same'
      };
    }

    function summarise(stations) {
      if (!stations || !stations.length) return null;
      const prices = stations.map(s => s.price);
      return {
        min:      Math.min(...prices),
        avg:      +(prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(1),
        max:      Math.max(...prices),
        count:    stations.length,
        cheapest: stations[0],
        stations: stations.slice(0, 15),
      };
    }

    function recommendation(todayMin, tmrMin) {
      if (todayMin == null || tmrMin == null) return null;
      const diff = +(tmrMin - todayMin).toFixed(1);
      if (diff <= -3) return { action: 'wait', diff, icon: '⏳', text: `Wait until tomorrow — prices drop ${Math.abs(diff)}c/L` };
      if (diff >=  3) return { action: 'fill', diff, icon: '⛽', text: `Fill up today — prices rise ${diff}c/L tomorrow` };
      return { action: 'neutral', diff, icon: '✓', text: 'Prices are similar — fill up whenever suits you' };
    }

    /* ─────────────────────────────── CORS proxy fetch ── */
    const PROXIES = [
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    ];

    async function proxyFetch(url) {
      for (const proxy of PROXIES) {
        try {
          const r = await fetch(proxy(url), { signal: AbortSignal.timeout(12000) });
          if (r.ok) return await r.text();
        } catch { /* try next */ }
      }
      throw new Error('All proxies failed');
    }

    function parseRSS(xml) {
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      const stations = [];
      doc.querySelectorAll('item').forEach(item => {
        const g = tag => item.querySelector(tag)?.textContent?.trim() || '';
        const p = parseFloat(g('price'));
        if (!isNaN(p)) stations.push({ price: p, name: g('trading-name'), brand: g('brand'), address: g('address'), suburb: g('location') });
      });
      return stations.sort((a, b) => a.price - b.price);
    }

    function fuelWatchURL(product, suburb, day) {
      return `https://www.fuelwatch.wa.gov.au/fuelwatch/fuelWatchRSS?Product=${product}&Suburb=${encodeURIComponent(suburb.toUpperCase())}&Day=${day}&Surrounding=1`;
    }

    /* ─────────────────────────────── Location ── */
    async function requestLocation() {
      const btn   = document.getElementById('loc-btn');
      const icon  = document.getElementById('loc-icon');
      const label = document.getElementById('loc-label');

      btn.className   = 'location-pill locating';
      icon.textContent = '';
      label.innerHTML  = '<span class="inline-spinner"></span> Locating…';
      btn.disabled     = true;

      try {
        // 1 — Get GPS coords
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000 }));
        const { latitude: lat, longitude: lng } = pos.coords;

        // 2 — Reverse geocode with OpenStreetMap Nominatim (free, no key)
        label.innerHTML = '<span class="inline-spinner"></span> Finding suburb…';
        const geo = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
          { headers: { 'Accept-Language': 'en-AU', 'User-Agent': 'FuelWatch-App/1.0' } }
        );
        const geoData = await geo.json();
        const suburb  = geoData.address?.suburb
                     || geoData.address?.city_district
                     || geoData.address?.town
                     || geoData.address?.village
                     || geoData.address?.county;

        if (!suburb) throw new Error('Suburb not found');
        detectedSuburb = suburb;

        // 3 — Fetch live prices for this suburb
        label.innerHTML = `<span class="inline-spinner"></span> Fetching ${suburb} prices…`;

        const combos = [
          { code: '1', name: 'Unleaded 91', day: 'today' },
          { code: '1', name: 'Unleaded 91', day: 'tomorrow' },
          { code: '2', name: 'Premium 95',  day: 'today' },
          { code: '2', name: 'Premium 95',  day: 'tomorrow' },
        ];

        const fetched = await Promise.all(
          combos.map(async ({ code, name, day }) => {
            const xml      = await proxyFetch(fuelWatchURL(code, suburb, day));
            const stations = parseRSS(xml);
            return { name, day, stations };
          })
        );

        // 4 — Build liveData in same shape as allData
        liveData = {};
        for (const { name, day, stations } of fetched) {
          if (!liveData[name]) liveData[name] = { today: null, tomorrow: null, history: [] };
          liveData[name][day] = summarise(stations);
        }
        for (const name of Object.keys(liveData)) {
          liveData[name].recommendation = recommendation(liveData[name].today?.min, liveData[name].tomorrow?.min);
          liveData[name].fetched_at     = new Date().toLocaleString('en-AU', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
          // Attach pre-fetched history for the chart
          liveData[name].history = allData?.[name]?.history || [];
        }

        // 5 — Render
        btn.className    = 'location-pill located';
        icon.textContent = '📍';
        label.textContent = suburb;
        document.getElementById('last-updated').textContent =
          `Live prices · ${new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' })}`;

        render(liveData);

      } catch (err) {
        btn.className     = 'location-pill error';
        icon.textContent  = '⚠️';
        label.textContent = err.code === 1 ? 'Location denied' : 'Location failed — tap to retry';
        btn.disabled      = false;
      }
    }

    /* ─────────────────────────────── Render ── */
    function currentData() { return liveData || allData; }

    function render(data) {
      if (!data) return;
      const names   = Object.keys(data);
      const tabsEl  = document.getElementById('fuel-tabs');
      const panelsEl = document.getElementById('panels');
      tabsEl.innerHTML  = '';
      panelsEl.innerHTML = '';

      names.forEach(name => {
        // Fuel tab
        const tab = document.createElement('button');
        tab.className  = 'fuel-tab';
        tab.dataset.name = name;
        tab.textContent  = name;
        tab.onclick = () => switchFuel(name);
        tabsEl.appendChild(tab);

        // Panel
        const panel = document.createElement('div');
        panel.className = 'fuel-panel';
        panel.id = `panel-${name.replace(/\s/g, '-')}`;
        panelsEl.appendChild(panel);
      });

      updateDayHints(data);
      switchFuel(activeTab && data[activeTab] ? activeTab : names[0]);
      document.getElementById('content').style.display = 'block';
    }

    function updateDayHints(data) {
      // Show cheapest min price in day tab hints for ULP91
      const fuel91 = data['Unleaded 91'];
      if (!fuel91) return;
      const h91t = document.getElementById('hint-today-91');
      const h91m = document.getElementById('hint-tomorrow-91');
      if (h91t && fuel91.today)    h91t.textContent = fmt(fuel91.today.min) + '¢';
      if (h91m && fuel91.tomorrow) h91m.textContent = fmt(fuel91.tomorrow.min) + '¢';
    }

    function switchDay(day) {
      activeDay = day;
      document.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', t.dataset.day === day));
      // Re-render current fuel panel
      const data = currentData();
      if (data && activeTab) renderFuelPanel(activeTab, data[activeTab]);
    }

    function switchFuel(name) {
      activeTab = name;
      document.querySelectorAll('.fuel-tab').forEach(t => {
        t.classList.remove('active-91', 'active-95');
      });
      const tab = document.querySelector(`.fuel-tab[data-name="${name}"]`);
      if (tab) tab.classList.add(name.includes('91') ? 'active-91' : 'active-95');
      document.querySelectorAll('.fuel-panel').forEach(p => p.classList.remove('visible'));
      const panel = document.getElementById(`panel-${name.replace(/\s/g, '-')}`);
      if (panel) {
        panel.classList.add('visible');
        renderFuelPanel(name, currentData()[name]);
      }
    }

    function toggleStations(name) {
      showAllMap[name] = !showAllMap[name];
      renderFuelPanel(name, currentData()[name]);
    }

    function renderFuelPanel(name, data) {
      const panel = document.getElementById(`panel-${name.replace(/\s/g, '-')}`);
      if (!panel || !data) return;

      const day  = activeDay;
      const info = data[day];
      const other = day === 'today' ? data.tomorrow : data.today;
      const rec   = data.recommendation;
      const hist  = data.history || [];
      const showAll = showAllMap[name] || false;

      // Diff vs the other day
      const diff    = (info?.min != null && other?.min != null)
        ? +(other.min - info.min).toFixed(1) : null;
      const diffObj = diffLabel(diff);
      const tmrLabel = day === 'today' ? 'Tomorrow' : 'Today';

      // Summary card
      const summaryHtml = info ? `
        <div class="summary-card">
          <div class="summary-main">
            <div class="summary-label">${day === 'today' ? "Today's" : "Tomorrow's"} cheapest</div>
            <div class="summary-price">${fmt(info.min)}<span class="unit">¢/L</span></div>
            <div class="summary-sub">
              <span>Avg <b>${fmt(info.avg)}¢</b></span>
              <span>Max <b>${fmt(info.max)}¢</b></span>
              <span><b>${info.count}</b> stations</span>
            </div>
            ${info.cheapest ? `<div class="summary-cheapest">Cheapest: <strong>${info.cheapest.name}</strong>, ${info.cheapest.suburb}</div>` : ''}
          </div>
          ${other ? `
          <div class="tmr-badge">
            <div class="tmr-label">${tmrLabel}</div>
            <div class="tmr-price ${diffObj.cls}">${fmt(other.min)}¢</div>
            <div class="tmr-diff ${diffObj.cls}">${diffObj.text}</div>
          </div>` : ''}
        </div>` : `
        <div class="summary-card" style="color:var(--muted)">No data available for ${day}</div>`;

      // Recommendation
      const recHtml = rec ? `
        <div class="rec-banner rec-${rec.action}">
          <span class="rec-icon">${rec.icon}</span>
          <span>${rec.text}</span>
        </div>` : '';

      // Stations list
      const stations    = info?.stations || [];
      const visibleList = showAll ? stations : stations.slice(0, 5);
      const stationRows = visibleList.map((s, i) => `
        <div class="station-row">
          <div class="station-rank">${i + 1}</div>
          <div class="station-info">
            <div class="s-name">${s.name || '—'}</div>
            <div class="s-addr">${s.suburb}${s.address ? ' · ' + s.address : ''}</div>
          </div>
          <div class="station-price">${fmt(s.price)}<span class="cpl">¢</span></div>
        </div>`).join('');

      const stationsHtml = `
        <div class="stations-section">
          <div class="stations-header">
            <span>${day === 'today' ? "Today's" : "Tomorrow's"} Cheapest Stations</span>
            ${stations.length > 5
              ? `<button class="stations-toggle" onclick="toggleStations('${name}')">${showAll ? 'Show less' : 'Show all ' + stations.length}</button>`
              : ''}
          </div>
          ${stationRows || '<div style="padding:16px;color:var(--muted);font-size:.85rem">No stations found</div>'}
        </div>`;

      // Chart
      const chartId   = `chart-${name.replace(/\s/g, '-')}`;
      const chartHtml = hist.length > 1
        ? `<div class="chart-card"><h3>Price History — Lowest ¢/L</h3><div class="chart-wrapper"><canvas id="${chartId}"></canvas></div></div>`
        : `<div class="chart-card"><h3>Price History</h3><div class="no-history">History builds daily — check back tomorrow!</div></div>`;

      panel.innerHTML = summaryHtml + recHtml + stationsHtml + chartHtml;

      if (hist.length > 1) setTimeout(() => buildChart(name, hist), 30);
    }

    function buildChart(name, hist) {
      const chartId = `chart-${name.replace(/\s/g, '-')}`;
      const ctx = document.getElementById(chartId);
      if (!ctx) return;
      if (charts[name]) charts[name].destroy();
      const color = fuelColor(name);
      charts[name] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: hist.map(h => new Date(h.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })),
          datasets: [
            { label: 'Min', data: hist.map(h => h.min), borderColor: color, backgroundColor: color + '22', borderWidth: 2, pointRadius: hist.length < 14 ? 4 : 2, pointBackgroundColor: color, fill: true, tension: 0.35 },
            { label: 'Avg', data: hist.map(h => h.avg), borderColor: color + '77', borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, fill: false, tension: 0.35 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#8892a4', font: { size: 10 }, boxWidth: 12 } },
            tooltip: { callbacks: { label: c => ` ${c.parsed.y.toFixed(1)}¢/L` } }
          },
          scales: {
            x: { ticks: { color: '#8892a4', font: { size: 9 }, maxTicksLimit: 7 }, grid: { color: '#2e3347' } },
            y: { ticks: { color: '#8892a4', font: { size: 9 }, callback: v => v + '¢' }, grid: { color: '#2e3347' } }
          }
        }
      });
    }

    /* ─────────────────────────────── Initial load ── */
    async function load() {
      document.getElementById('loading').style.display = 'block';
      try {
        const resp = await fetch('data/prices.json?t=' + Date.now());
        if (!resp.ok) throw new Error();
        allData = await resp.json();

        const firstKey = Object.keys(allData)[0];
        document.getElementById('last-updated').textContent =
          `Default area · Updated ${allData[firstKey]?.fetched_at || ''}`;

        render(allData);
      } catch {
        document.getElementById('error-msg').style.display = 'block';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    load();
  </script>
</body>
</html>
