name: Update Fuel Prices

on:
  schedule:
    - cron: '5 22 * * *'   # 06:05 AWST — FuelWatch early update
    - cron: '5 16 * * *'   # 00:05 AWST — fresh today's prices
    - cron: '30 6 * * *'   # 14:30 AWST — tomorrow's prices (right as FuelWatch publishes)
    - cron: '45 6 * * *'   # 14:45 AWST — backup in case 14:30 was early
    - cron: '30 7 * * *'   # 15:30 AWST — backup in case 14:45 run was delayed
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/
          git diff --staged --quiet || git commit -m "chore: update fuel prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
